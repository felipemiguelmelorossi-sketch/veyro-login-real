<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;

    h2 {

      border-color: #7187ff;

<body>

  <div class="container">

    <div class="logo">VEYRO</div>

    <div class="subtitle">
      Seu entretenimento em um só lugar
    </div>


    <!-- LOGIN -->

    <div id="loginBox">

      <h2>Bem-vindo de volta</h2>

      <p class="description">
        Entre na sua conta para continuar assistindo.
      </p>

      <form id="loginForm">

        <label for="loginEmail">
          E-mail
        </label>

        <input
          type="email"
          id="loginEmail"
          placeholder="seu@email.com"
          required
        >

        <label for="loginPassword">
          Senha
        </label>

        <input
          type="password"
          id="loginPassword"
          placeholder="Sua senha"
          required
        >

        <div class="forgot">

          <span onclick="forgotPassword()">
            Esqueci minha senha
          </span>

        </div>

        <button type="submit" id="loginButton">
          Entrar
        </button>

      </form>

      <div class="switch">

        Ainda não possui uma conta?

        <span onclick="showRegister()">
          Criar conta
        </span>

      </div>

    </div>


    <!-- CADASTRO -->

    <div id="registerBox" class="hidden">

      <h2>Criar conta</h2>

      <p class="description">
        Crie sua conta Veyro gratuitamente.
      </p>

      <form id="registerForm">

        <label for="registerName">
          Nome
        </label>

        <input
          type="text"
          id="registerName"
          placeholder="Seu nome"
          required
        >

        <label for="registerEmail">
          E-mail
        </label>

        <input
          type="email"
          id="registerEmail"
          placeholder="seu@email.com"
          required
        >

        <label for="registerPassword">
          Senha
        </label>

        <input
          type="password"
          id="registerPassword"
          placeholder="Crie uma senha"
          minlength="6"
          required
        >

        <button type="submit" id="registerButton">
          Criar conta
        </button>

      </form>

      <div class="switch">

        Já possui uma conta?

        <span onclick="showLogin()">
          Entrar
        </span>

      </div>

    </div>


    <div id="message" class="message"></div>


    <div class="footer">
      © 2026 Veyro
    </div>

  </div>


  <script>

    // ==========================================
    // SUPABASE
    // ==========================================

    const SUPABASE_URL =
      "https://dnojapjtsgxsgmxxjhrp.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_zZy8CirGsWqjzYIv2GIanA_BQaASny8";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // ==========================================
    // SITE DO VEYRO / MEGAEMBED
    // ==========================================

    const VEYRO_URL =
      "https://veyro.megaembed.com";


    // ==========================================
    // MOSTRAR CADASTRO
    // ==========================================

    function showRegister() {

      document
        .getElementById("loginBox")
        .classList.add("hidden");

      document
        .getElementById("registerBox")
        .classList.remove("hidden");

      clearMessage();
    }


    // ==========================================
    // MOSTRAR LOGIN
    // ==========================================

    function showLogin() {

      document
        .getElementById("registerBox")
        .classList.add("hidden");

      document
        .getElementById("loginBox")
        .classList.remove("hidden");

      clearMessage();
    }


    // ==========================================
    // MENSAGEM
    // ==========================================

    function showMessage(text, type = "") {

      const message =
        document.getElementById("message");

      message.textContent = text;

      message.className =
        "message " + type;

      message.style.display = "block";
    }


    function clearMessage() {

      document
        .getElementById("message")
        .style.display = "none";

    }


    // ==========================================
    // CRIAR CONTA
    // ==========================================

    document
      .getElementById("registerForm")
      .addEventListener("submit", async function(event) {

        event.preventDefault();

        const name =
          document
            .getElementById("registerName")
            .value
            .trim();

        const email =
          document
            .getElementById("registerEmail")
            .value
            .trim();

        const password =
          document
            .getElementById("registerPassword")
            .value;

        const button =
          document.getElementById("registerButton");

        button.disabled = true;

        button.textContent =
          "Criando conta...";

        clearMessage();


        try {

          const { data, error } =
            await supabaseClient.auth.signUp({

              email: email,

              password: password,

              options: {

                data: {
                  name: name
                }

              }

            });


          if (error) {
            throw error;
          }


          showMessage(
            "Conta criada com sucesso! Verifique seu e-mail para confirmar a conta.",
            "success"
          );


          document
            .getElementById("registerForm")
            .reset();


        } catch (error) {

          showMessage(
            traduzirErro(error.message),
            "error"
          );


        } finally {

          button.disabled = false;

          button.textContent =
            "Criar conta";

        }

      });


    // ==========================================
    // LOGIN
    // ==========================================

    document
      .getElementById("loginForm")
      .addEventListener("submit", async function(event) {

        event.preventDefault();


        const email =
          document
            .getElementById("loginEmail")
            .value
            .trim();

        const password =
          document
            .getElementById("loginPassword")
            .value;


        const button =
          document.getElementById("loginButton");


        button.disabled = true;

        button.textContent =
          "Entrando...";

        clearMessage();


        try {

          const { data, error } =
            await supabaseClient.auth.signInWithPassword({

              email: email,

              password: password

            });


          if (error) {
            throw error;
          }


          showMessage(
            "Login realizado com sucesso! Abrindo Veyro...",
            "success"
          );


          setTimeout(function() {

            window.location.href =
              VEYRO_URL;

          }, 1000);


        } catch (error) {

          showMessage(
            traduzirErro(error.message),
            "error"
          );


        } finally {

          button.disabled = false;

          button.textContent =
            "Entrar";

        }

      });


    // ==========================================
    // ESQUECI MINHA SENHA
    // ==========================================

    async function forgotPassword() {

      const email =
        document
          .getElementById("loginEmail")
          .value
          .trim();


      if (!email) {

        showMessage(
          "Digite seu e-mail primeiro.",
          "error"
        );

        return;
      }


      try {

        const { error } =
          await supabaseClient.auth
            .resetPasswordForEmail(
              email,
              {
                redirectTo:
                  window.location.origin
              }
            );


        if (error) {
          throw error;
        }


        showMessage(
          "Enviamos um link de recuperação para seu e-mail.",
          "success"
        );


      } catch (error) {

        showMessage(
          traduzirErro(error.message),
          "error"
        );

      }

    }


    // ==========================================
    // TRADUZIR ERROS
    // ==========================================

    function traduzirErro(error) {

      const texto =
        error.toLowerCase();


      if (
        texto.includes(
          "invalid login credentials"
        )
      ) {
        return "E-mail ou senha incorretos.";
      }


      if (
        texto.includes(
          "user already registered"
        )
      ) {
        return "Esse e-mail já possui uma conta.";
      }


      if (
        texto.includes(
          "password should be at least"
        )
      ) {
        return "A senha precisa ter pelo menos 6 caracteres.";
      }


      if (
        texto.includes(
          "email not confirmed"
        )
      ) {
        return "Confirme seu e-mail antes de entrar.";
      }


      if (
        texto.includes(
          "invalid email"
        )
      ) {
        return "Digite um e-mail válido.";
      }


      return error;

    }


    // ==========================================
    // VERIFICAR SESSÃO
    // ==========================================

    async function verificarUsuario() {

      const {
        data: { session }
      } =
        await supabaseClient.auth.getSession();


      if (session) {

        // Usuário já está logado.
        // Pode entrar diretamente no Veyro.

        window.location.href =
          VEYRO_URL;

      }

    }


    verificarUsuario();

  </script>

</body>
</html>
